spring:
  application:
    name: formaspace-server
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/formaspace?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&preserveInstants=true&characterEncoding=UTF-8}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
    baseline-on-migrate: false
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    test-connection: false
    properties:
      "[mail.smtp.auth]": ${SMTP_AUTH:true}
      "[mail.smtp.starttls.enable]": ${SMTP_STARTTLS:true}
      "[mail.smtp.starttls.required]": ${SMTP_STARTTLS:true}
      "[mail.smtp.ssl.enable]": ${SMTP_SSL:false}
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
  web:
    error:
      include-message: never
      include-stacktrace: never
      include-binding-errors: never
      include-exception: false
  jackson:
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: true
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: none
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  type-handlers-package: com.xiye.formaspace.config
  global-config:
    db-config:
      id-type: auto
formaspace:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  email-code:
    enabled: ${EMAIL_CODE_ENABLED:false}
    hmac-key: ${AUTH_CODE_HMAC_KEY:}
    from: ${SMTP_FROM:}
    ttl: ${EMAIL_CODE_TTL:5m}
    cooldown: ${EMAIL_CODE_COOLDOWN:60s}
    max-failed-attempts: ${EMAIL_CODE_MAX_FAILURES:5}
    max-sends-per-email-per-hour: ${EMAIL_CODE_EMAIL_HOURLY:5}
    max-sends-per-ip-per-hour: ${EMAIL_CODE_IP_HOURLY:20}
  storage:
    root: ${FILE_STORAGE_ROOT:${user.home}/.formaspace/storage}
    max-upload-bytes: ${UPLOAD_MAX_BYTES:10485760}
    max-image-pixels: ${UPLOAD_MAX_PIXELS:16000000}
    max-model-bytes: ${MODEL_MAX_BYTES:104857600}
  generation:
    mode: ${INFERENCE_MODE:DISABLED}
    max-active-per-user: ${GENERATION_MAX_ACTIVE_PER_USER:1}
    mock-concurrency: ${MOCK_CONCURRENCY:1}
    mock-stage-delay: ${MOCK_STAGE_DELAY:2s}
    mock-poll-delay-ms: ${MOCK_POLL_DELAY_MS:1000}
    mock-demo-glb: ${MOCK_DEMO_GLB:}
    profile-id: mock-v1
    minimum-steps: 1
    maximum-steps: 20
    minimum-guidance: 0
    maximum-guidance: 10
    octree-resolutions: [128, 256]
    maximum-voxel-steps: 268435456
    num-chunks: 8000
    quality-presets:
      STANDARD:
        inference-steps: 5
        guidance-scale: 5
        octree-resolution: 128
      HIGH:
        inference-steps: 10
        guidance-scale: 5
        octree-resolution: 256
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:formaspace-server}
    audience: ${JWT_AUDIENCE:formaspace-web}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:2h}
    clock-skew: ${JWT_CLOCK_SKEW:30s}
  auth-rate-limit:
    login-window: ${AUTH_LOGIN_WINDOW:15m}
    login-account-failures: ${AUTH_LOGIN_ACCOUNT_FAILURES:10}
    login-ip-failures: ${AUTH_LOGIN_IP_FAILURES:50}
    register-window: ${AUTH_REGISTER_WINDOW:15m}
    register-email-attempts: ${AUTH_REGISTER_EMAIL_ATTEMPTS:10}
    register-ip-attempts: ${AUTH_REGISTER_IP_ATTEMPTS:30}
logging:
  level:
    org.springframework.web: INFO
    org.springframework.security: WARN
    org.springframework.mail: WARN
    org.springframework.jdbc: WARN
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: WARN
